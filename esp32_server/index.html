<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estación de Control de Grúa Torre</title>
    <style>
        :root {
            --crane-yellow: #facc15; /* Amarillo de maquinaria pesada */
            --bg-dark: #090d12;
            --panel-bg: #151f2c;
            --danger-red: #dc2626;
            --iron-gray: #475569;
            --steel-dark: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
        }

        /* CONSOLA DE MANDO DE MAQUINARIA PESADA */
        .grue-console {
            width: 100%;
            max-width: 400px;
            background-color: var(--panel-bg);
            border: 4px solid #2e435e;
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 12px 28px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
        }

        /* Franjas de advertencia de seguridad (Amarillo/Negro) */
        .hazard-lines {
            height: 10px;
            background: repeating-linear-gradient(
                -45deg,
                #000000,
                #000000 8px,
                var(--crane-yellow) 8px,
                var(--crane-yellow) 16px
            );
            margin: -12px -12px 10px -12px;
            border-bottom: 2px solid #000;
        }

        .hazard-lines.bottom {
            margin: 14px -12px -12px -12px;
            border-bottom: none;
            border-top: 2px solid #000;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 1.05rem;
            letter-spacing: 1.5px;
            font-weight: 800;
            color: var(--crane-yellow);
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* DASHBOARD DEL GEMELO DIGITAL */
        .monitor-dashboard {
            background: linear-gradient(180deg, #07111c 0%, #03070d 100%);
            border: 2px solid #22374e;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-around;
            box-shadow: inset 0 0 20px rgba(0, 200, 255, 0.15);
        }

        .view-container {
            text-align: center;
            font-size: 0.65rem;
            font-weight: 800;
            color: #94a3b8;
        }

        .view-container span {
            color: var(--crane-yellow);
        }

        svg {
            background: #040910;
            border: 1px solid #1b2e44;
            border-radius: 6px;
            margin-top: 4px;
        }

        /* CONTENEDOR DE AMBOS MANDOS */
        .joysticks-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 4px;
        }

        .joystick-card {
            background: #0b121a;
            border: 1px solid #22354b;
            border-radius: 12px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
            position: relative;
            height: 150px;
            justify-content: space-between;
        }

        .joystick-label {
            font-size: 0.65rem;
            font-weight: bold;
            color: #cbd5e1;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* PALANCA 1: BASE CIRCULAR (GIRO Y CARRO 360°) */
        .joystick-base-circular {
            width: 105px;
            height: 105px;
            background: radial-gradient(circle, #1a293a 0%, #060a0f 100%);
            border-radius: 50%;
            border: 3px solid #334e6e;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* PALANCA 2: BASE LINEAL (GANCHO - TRACTOR) */
        .joystick-base-linear {
            width: 44px;
            height: 105px;
            background: linear-gradient(90deg, #090f14 0%, #1a293a 50%, #090f14 100%);
            border-radius: 10px;
            border: 3px solid #334e6e;
            position: relative;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* PERILLA ERGONÓMICA DE LOS JOYSTICKS */
        .joystick-knob {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 35% 35%, #52657a 0%, #1e2936 60%, #090d12 100%);
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.15);
            border: 2px solid #475d7a;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joystick-knob::after {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--danger-red);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--danger-red);
        }

        /* Posición central por defecto para el control lineal */
        #joyGancho {
            top: 30px;
        }

        /* INDICADORES VISUALES DE DIRECCIÓN (FLECHAS) */
        .guide {
            position: absolute;
            font-size: 0.6rem;
            color: #527094;
            font-weight: bold;
        }
        .guide-up    { top: 4px; }
        .guide-down  { bottom: 4px; }
        .guide-left  { left: 6px; }
        .guide-right { right: 6px; }

        /* SECCIÓN INFERIOR: PARADA DE EMERGENCIA */
        .emergency-container {
            margin-top: 14px;
        }

        .btn-estop {
            width: 100%;
            height: 46px;
            background: linear-gradient(145deg, #ef4444, #991b1b);
            border: 2px solid #7f1d1d;
            border-bottom: 5px solid #4c0519;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.25);
            transition: all 0.05s ease;
        }

        .btn-estop:active {
            background: #7f1d1d;
            border-bottom: 2px solid #4c0519;
            transform: translateY(3px);
            box-shadow: 0 0 12px var(--danger-red);
        }
    </style>
</head>
<body>

    <div class="grue-console">
        <div class="hazard-lines"></div>

        <h2>SISTEMA DE CONTROL DE GRÚA INDUSTRIAL</h2>

        <div class="monitor-dashboard">
            <div class="view-container">
                <span>VISTA PLANTA (GIRO)</span><br>
                <svg width="170" height="170" id="svgPlanta">
                    <defs>
                        <linearGradient id="metal3D" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#94a3b8"/>
                            <stop offset="50%" stop-color="#475569"/>
                            <stop offset="100%" stop-color="#1e293b"/>
                        </linearGradient>
                    </defs>

                    <circle cx="85" cy="85" r="75" stroke="#162e49" stroke-width="1" fill="none" stroke-dasharray="3"/>
                    <circle cx="85" cy="85" r="45" stroke="#162e49" stroke-width="1" fill="none" stroke-dasharray="3"/>
                    
                    <rect x="50" y="50" width="70" height="70" rx="10" fill="none" stroke="#224469" stroke-width="2"/>
                    <circle cx="56" cy="56" r="2.5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
                    <circle cx="114" cy="56" r="2.5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
                    <circle cx="56" cy="114" r="2.5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
                    <circle cx="114" cy="114" r="2.5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
                    
                    <rect x="73" y="71" width="24" height="28" fill="none" stroke="var(--crane-yellow)" stroke-width="1.5"/>
                    <circle cx="85" cy="85" r="7" fill="url(#metal3D)"/>

                    <g id="plumaGiro" transform="rotate(0 85 85)">
                        <rect x="40" y="81" width="45" height="8" fill="#334155" rx="1"/>
                        <rect x="85" y="80" width="78" height="10" fill="none" stroke="var(--crane-yellow)" stroke-width="2" rx="1"/>
                        <line x1="100" y1="80" x2="110" y2="90" stroke="var(--crane-yellow)" stroke-width="1"/>
                        <line x1="120" y1="80" x2="130" y2="90" stroke="var(--crane-yellow)" stroke-width="1"/>
                        <line x1="140" y1="80" x2="150" y2="90" stroke="var(--crane-yellow)" stroke-width="1"/>
                        
                        <rect id="carroPlanta" x="110" y="77" width="16" height="16" fill="#ffffff" rx="2" stroke="#000000" stroke-width="1"/>
                    </g>
                </svg>
            </div>

            <div class="view-container">
                <span>VISTA PERFIL (GANCHO)</span><br>
                <svg width="170" height="170">
                    <line x1="10" y1="155" x2="160" y2="155" stroke="#334155" stroke-width="3" stroke-dasharray="2"/>

                    <rect x="40" y="30" width="16" height="125" fill="none" stroke="#64748b" stroke-width="2"/>
                    <line x1="40" y1="50" x2="56" y2="75" stroke="#475569" stroke-width="1.2"/>
                    <line x1="56" y1="50" x2="40" y2="75" stroke="#475569" stroke-width="1.2"/>
                    <line x1="40" y1="100" x2="56" y2="125" stroke="#475569" stroke-width="1.2"/>
                    <line x1="56" y1="100" x2="40" y2="125" stroke="#475569" stroke-width="1.2"/>

                    <rect x="20" y="20" width="140" height="10" fill="url(#metal3D)" stroke="var(--crane-yellow)" stroke-width="1"/>
                    
                    <g id="carroComponentePerfil" transform="translate(110, 0)">
                        <rect x="-8" y="27" width="16" height="7" fill="#ffffff" rx="1" stroke="#000000" stroke-width="1"/>
                        <line id="cablePerfil" x1="0" y1="34" x2="0" y2="75" stroke="#e2e8f0" stroke-width="1.2"/>
                        
                        <g id="ganchoPerfil" transform="translate(0, 0)">
                            <rect x="-4" y="75" width="8" height="10" fill="var(--crane-yellow)" rx="1"/>
                            <path d="M 0 85 Q -5 90 0 94 Q 4 90 2 87" fill="none" stroke="var(--crane-yellow)" stroke-width="2"/>
                        </g>
                    </g>
                </svg>
            </div>
        </div>

        <div class="joysticks-container">
            <div class="joystick-card">
                <div class="joystick-label">MANDO CARRO / GIRO</div>
                <div class="joystick-base-circular">
                    <span class="guide guide-up">▲</span>
                    <span class="guide guide-down">▼</span>
                    <span class="guide guide-left">◀</span>
                    <span class="guide guide-right">▶</span>
                    <div class="joystick-knob" id="joyIzquierdo"></div>
                </div>
            </div>

            <div class="joystick-card">
                <div class="joystick-label">GANCHO DE CARGA</div>
                <div class="joystick-base-linear">
                    <span class="guide guide-up">▲</span>
                    <span class="guide guide-down">▼</span>
                    <div class="joystick-knob" id="joyGancho"></div>
                </div>
            </div>
        </div>

        <div class="emergency-container">
            <button class="btn-estop" id="btnEStop">PARADA DE EMERGENCIA</button>
        </div>

        <div class="hazard-lines bottom"></div>
    </div>

    <script>
        let anguloGiro = 0;
        let posicionCarro = 110; 
        let posicionGancho = 0;  
        let loopAnimacion = null;
        let comandoActivo = "S";

        const plumaGiro = document.getElementById('plumaGiro');
        const carroPlanta = document.getElementById('carroPlanta');
        const carroComponentePerfil = document.getElementById('carroComponentePerfil');
        const cablePerfil = document.getElementById('cablePerfil');
        const ganchoPerfil = document.getElementById('ganchoPerfil');

        const rangoMaximo = 30; // Desplazamiento máximo en px

        // --- INTERFAZ 1: JOYSTICK IZQUIERDO CIRCULAR (360 GRADOS) ---
        configurarJoystickCircular(document.getElementById('joyIzquierdo'), (dx, dy, dist) => {
            if (dist <= 8) return "S"; // Filtro de holgura
            if (Math.abs(dx) > Math.abs(dy)) {
                return dx > 0 ? "R" : "L"; // Giro Horario (Derecha) o Antihorario (Izquierda)
            } else {
                return dy > 0 ? "B" : "F"; // Carro Atrás (Abajo) o Adelante (Arriba)
            }
        });

        // --- INTERFAZ 2: JOYSTICK DERECHO LINEAL RECTILÍNEO (SÓLO ARRIBA/ABAJO) ---
        configurarJoystickLineal(document.getElementById('joyGancho'), (dy) => {
            if (Math.abs(dy) <= 8) return "S";
            return dy > 0 ? "D" : "U"; // Bajar Gancho (Abajo) o Subir Gancho (Arriba)
        });

        // Lógica de operación omnidireccional para el carro y giros
        function configurarJoystickCircular(elemento, calcularComando) {
            let startX = 0, startY = 0;
            let comandoAnterior = "S";

            const presionar = (e) => {
                const touch = e.touches ? e.touches[0] : e;
                startX = touch.clientX;
                startY = touch.clientY;
                document.addEventListener('touchmove', mover, { passive: false });
                document.addEventListener('touchend', soltar);
                document.addEventListener('mousemove', mover);
                document.addEventListener('mouseup', soltar);
                if (!loopAnimacion) loopAnimacion = setInterval(refrescarMonitor, 30);
            };

            const mover = (e) => {
                if (e.cancelable) e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                let dx = touch.clientX - startX;
                let dy = touch.clientY - startY;

                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > rangoMaximo) {
                    dx = (dx / dist) * rangoMaximo;
                    dy = (dy / dist) * rangoMaximo;
                }

                elemento.style.transform = `translate(${dx}px, ${dy}px)`;

                let nuevoCmd = calcularComando(dx, dy, dist);
                if (nuevoCmd !== comandoAnterior) {
                    comandoAnterior = nuevoCmd;
                    despacharComando(nuevoCmd);
                }
            };

            const soltar = () => {
                elemento.style.transform = 'translate(0px, 0px)';
                removerEventos(mover, soltar);
                finalizarComando();
            };

            elemento.addEventListener('touchstart', presionar);
            elemento.addEventListener('mousedown', presionar);
        }

        // Lógica de operación restringida a carril vertical (Gancho)
        function configurarJoystickLineal(elemento, calcularComando) {
            let startY = 0;
            let comandoAnterior = "S";

            const presionar = (e) => {
                const touch = e.touches ? e.touches[0] : e;
                startY = touch.clientY;
                document.addEventListener('touchmove', mover, { passive: false });
                document.addEventListener('touchend', soltar);
                document.addEventListener('mousemove', mover);
                document.addEventListener('mouseup', soltar);
                if (!loopAnimacion) loopAnimacion = setInterval(refrescarMonitor, 30);
            };

            const mover = (e) => {
                if (e.cancelable) e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                let dy = touch.clientY - startY;

                if (dy > rangoMaximo) dy = rangoMaximo;
                if (dy < -rangoMaximo) dy = -rangoMaximo;

                elemento.style.transform = `translateY(${dy}px)`;

                let nuevoCmd = calcularComando(dy);
                if (nuevoCmd !== comandoAnterior) {
                    comandoAnterior = nuevoCmd;
                    despacharComando(nuevoCmd);
                }
            };

            const soltar = () => {
                elemento.style.transform = 'translateY(0px)';
                removerEventos(mover, soltar);
                finalizarComando();
            };

            elemento.addEventListener('touchstart', presionar);
            elemento.addEventListener('mousedown', presionar);
        }

        function removerEventos(mover, soltar) {
            document.removeEventListener('touchmove', mover);
            document.removeEventListener('touchend', soltar);
            document.removeEventListener('mousemove', mover);
            document.removeEventListener('mouseup', soltar);
        }

        function finalizarComando() {
            despacharComando("S");
            clearInterval(loopAnimacion);
            loopAnimacion = null;
        }

        // --- SISTEMA DE COMUNICACIÓN CON ESP32 ---
        function despacharComando(cmd) {
            comandoActivo = cmd;
            fetch('/api/command?cmd=' + cmd).catch(() => console.log("ESP32 Interconectado"));
            if (navigator.vibrate) navigator.vibrate(12);
        }

        // --- RENDERIZADO DEL GEMELO DIGITAL ---
        function refrescarMonitor() {
            if (comandoActivo === 'L') anguloGiro -= 1.8;
            if (comandoActivo === 'R') anguloGiro += 1.8;
            
            if (comandoActivo === 'F' && posicionCarro < 150) posicionCarro += 1.0;
            if (comandoActivo === 'B' && posicionCarro > 65) posicionCarro -= 1.0; 
            
            if (comandoActivo === 'U' && posicionGancho > 0) posicionGancho -= 1.0;
            if (comandoActivo === 'D' && posicionGancho < 65) posicionGancho += 1.0;

            // Actualización de vectores SVG
            plumaGiro.setAttribute('transform', `rotate(${anguloGiro} 85 85)`);
            carroPlanta.setAttribute('x', posicionCarro);
            carroComponentePerfil.setAttribute('transform', `translate(${posicionCarro}, 0)`);
            
            cablePerfil.setAttribute('y2', 34 + 41 + posicionGancho);
            ganchoPerfil.setAttribute('transform', `translate(0, ${posicionGancho})`);
        }

        // Parada de Emergencia General Física
        document.getElementById('btnEStop').addEventListener('click', () => {
            despacharComando('S');
            document.getElementById('joyIzquierdo').style.transform = 'translate(0px, 0px)';
            document.getElementById('joyGancho').style.transform = 'translateY(0px)';
            clearInterval(loopAnimacion);
            loopAnimacion = null;
        });
    </script>
</body>
</html>
