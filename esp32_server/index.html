<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grúa Torre - Control Remoto</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-active: #2563eb;
            --danger: #ef4444;
            --danger-active: #dc2626;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none; /* Evita zoom y scroll en móviles */
        }

        .title {
            margin-top: 20px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .control-group {
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .group-title {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 250px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: var(--text);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.1s ease;
            height: 70px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:active, .btn.active {
            background: var(--primary);
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Asignación de posiciones en el grid */
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-center { grid-column: 2; grid-row: 2; background: transparent; border: none; box-shadow: none; pointer-events: none; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .vertical-controls {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 250px;
        }

        .vertical-controls .btn {
            flex: 1;
            height: 80px;
        }

        .btn-stop {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.5);
            width: 100%;
            max-width: 250px;
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .btn-stop:active, .btn-stop.active {
            background: var(--danger);
            color: white;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-left: 10px;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .connection-status {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="title">Grúa Torre Control</div>
    <div class="connection-status">
        Conectado <span class="status-dot"></span>
    </div>

    <div class="container">
        <!-- Control de Carro y Giro -->
        <div class="control-group">
            <h3 class="group-title">Carro & Giro</h3>
            <div class="d-pad">
                <div class="btn btn-up" data-cmd="F">▲</div>
                <div class="btn btn-left" data-cmd="L">◀</div>
                <div class="btn-center"></div>
                <div class="btn btn-right" data-cmd="R">▶</div>
                <div class="btn btn-down" data-cmd="B">▼</div>
            </div>
        </div>

        <!-- Control de Elevación (Gancho) -->
        <div class="control-group">
            <h3 class="group-title">Elevación (Gancho)</h3>
            <div class="vertical-controls">
                <div class="btn" data-cmd="U">Subir<br>⇡</div>
                <div class="btn" data-cmd="D">Bajar<br>⇣</div>
            </div>
            <!-- Botón Stop manual de emergencia -->
            <div class="btn btn-stop" data-cmd="S">PARADA DE EMERGENCIA</div>
        </div>
    </div>

    <script>
        // Prevenir el menú contextual en móvil
        document.addEventListener('contextmenu', event => event.preventDefault());

        let activeCommand = null;

        // Función para enviar comando
        const sendCommand = (cmd) => {
            fetch(`/api/command?cmd=${cmd}`)
                .then(response => {
                    if (!response.ok) console.error('Error enviando comando');
                })
                .catch(err => console.error('Fetch error:', err));
        };

        const startAction = (e) => {
            e.preventDefault(); // Previene scroll o zoom
            const btn = e.target.closest('.btn');
            if (!btn || btn.classList.contains('btn-center')) return;

            const cmd = btn.getAttribute('data-cmd');
            if (cmd) {
                btn.classList.add('active');
                if (activeCommand !== cmd) {
                    activeCommand = cmd;
                    sendCommand(cmd);
                }
            }
        };

        const stopAction = (e) => {
            e.preventDefault();
            const btn = e.target.closest('.btn');
            if (btn) btn.classList.remove('active');
            
            if (activeCommand !== null) {
                activeCommand = null;
                sendCommand('S'); // Stop
            }
        };

        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(btn => {
            // Eventos táctiles
            btn.addEventListener('touchstart', startAction, {passive: false});
            btn.addEventListener('touchend', stopAction, {passive: false});
            btn.addEventListener('touchcancel', stopAction, {passive: false});
            
            // Eventos de ratón
            btn.addEventListener('mousedown', startAction);
            btn.addEventListener('mouseup', stopAction);
            btn.addEventListener('mouseleave', stopAction);
        });

        // Evento global para detener si se suelta fuera del botón
        document.addEventListener('mouseup', () => {
            if (activeCommand !== null) {
                activeCommand = null;
                sendCommand('S');
            }
        });
    </script>
</body>
</html>
